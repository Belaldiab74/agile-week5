name: Week 5 checks

on:
  pull_request:
    branches: [main]
    paths:
      - "week5/**"
      - ".github/workflows/week5.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff pylint
      - name: Measure the legacy baseline
        run: |
          python -m ruff --version
          python -m pylint --version
          python -m ruff check legacy_fees.py --statistics --exit-zero
          python -m pylint legacy_fees.py --exit-zero
      - run: python -m pytest -v
      - run: python -m ruff check grades.py fees.py test_grades.py test_fees.py
      - run: python -m ruff format --check grades.py fees.py test_grades.py test_fees.py
      - run: python -m pylint fees.py
